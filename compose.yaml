name: provider-support-stack
x-app-build: &app-build
  context: .
  target: runtime
x-owner-env: &owner-env
  PGADMIN_PASSWORD: ${STACK_DB_PASSWORD:?Generate a Compose env file first}
  APP_PASSWORD: ${STACK_APP_PASSWORD:?Generate a Compose env file first}
  VECTOR_PASSWORD: ${STACK_VECTOR_PASSWORD:?Generate a Compose env file first}
  READER_PASSWORD: ${STACK_READER_PASSWORD:?Generate a Compose env file first}
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    environment:
      POSTGRES_PASSWORD: ${STACK_DB_PASSWORD:?Generate a Compose env file first}
    volumes:
      - stack-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  bootstrap:
    image: provider-support-app:local
    build: *app-build
    environment: *owner-env
    command: ["python", "scripts/container_bootstrap.py"]
    depends_on:
      db:
        condition: service_healthy
  app:
    image: provider-support-app:local
    build: *app-build
    environment:
      DATABASE_URL: host=db port=5432 dbname=provider_support user=provider_app password=${STACK_APP_PASSWORD}
      VECTOR_SEARCH_URL: host=db port=5432 dbname=provider_knowledge user=knowledge_reader password=${STACK_READER_PASSWORD}
      OLLAMA_BASE_URL: ${STACK_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${STACK_HTTP_PORT:-5180}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
  index:
    image: provider-support-app:local
    build: *app-build
    profiles: [tools]
    command: ["python", "scripts/index_knowledge.py"]
    environment:
      VECTOR_DATABASE_URL: host=db port=5432 dbname=provider_knowledge user=provider_vectors password=${STACK_VECTOR_PASSWORD}
      OLLAMA_BASE_URL: ${STACK_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      bootstrap:
        condition: service_completed_successfully
  tests:
    image: provider-support-tests:local
    build:
      context: .
      target: test
    profiles: [tests]
    environment:
      DATABASE_URL: host=db port=5432 dbname=provider_support user=provider_app password=${STACK_APP_PASSWORD}
      TEST_DATABASE_URL: host=db port=5432 dbname=provider_support_test user=provider_app password=${STACK_APP_PASSWORD}
      VECTOR_DATABASE_URL: host=db port=5432 dbname=provider_knowledge user=provider_vectors password=${STACK_VECTOR_PASSWORD}
      VECTOR_SEARCH_URL: host=db port=5432 dbname=provider_knowledge user=knowledge_reader password=${STACK_READER_PASSWORD}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
volumes:
  stack-data:
